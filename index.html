<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankFlow | Client Portal</title>
    <style>
        body {
            background-color: #0f111a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #a0aec0;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f111a;
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #4299e1;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        button:disabled {
            background-color: #4a5568;
            cursor: not-allowed;
        }
        #result-panel {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 6px;
            background-color: #222639;
        }
        .success-text { color: #48bb78; font-weight: bold; margin-bottom: 15px;}
        .error-text { color: #f56565; margin-top: 15px; text-align: center; font-size: 14px;}
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 5px;
        }
        .info-row span:last-child {
            color: #63b3ed;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RankFlow Portal</h1>
    
    <div id="login-form">
        <div class="form-group">
            <label for="discord-id">Discord ID</label>
            <input type="text" id="discord-id" placeholder="輸入您的 Discord ID">
        </div>
        <div class="form-group">
            <label for="secret-token">Secret Token</label>
            <input type="password" id="secret-token" placeholder="輸入您的授權金鑰">
        </div>
        <button id="verify-btn" onclick="verifyLicense()">登入驗證</button>
        <div id="error-msg" class="error-text"></div>
    </div>

    <div id="result-panel">
        <div class="success-text">✅ Active / Authenticated</div>
        <div class="info-row">
            <span>Discord ID:</span>
            <span id="res-discord"></span>
        </div>
        <div class="info-row">
            <span>Subscription Tier:</span>
            <span id="res-tier"></span>
        </div>
        <div class="info-row">
            <span>Expiry Date:</span>
            <span id="res-expiry"></span>
        </div>
        <div class="info-row" style="border-bottom: none;">
            <span>Token Status:</span>
            <span style="color: #48bb78;">Valid</span>
        </div>
        <button style="margin-top: 20px; background-color: #4a5568;" onclick="location.reload()">登出 / 重新驗證</button>
    </div>
</div>

<script>
    // 你的 Render 後端 API 網址
    const API_ENDPOINT = 'https://rankflow-r1id.onrender.com/api/v2/portal/verify';

    async function verifyLicense() {
        const discordId = document.getElementById('discord-id').value.trim();
        const secretToken = document.getElementById('secret-token').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const btn = document.getElementById('verify-btn');

        errorMsg.innerText = '';

        if (!discordId || !secretToken) {
            errorMsg.innerText = '請完整輸入 Discord ID 與 Secret Token！';
            return;
        }

        // 按鈕轉為載入狀態
        btn.innerText = '驗證中...';
        btn.disabled = true;

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    discord_id: discordId,
                    secret_token: secretToken
                })
            });

            const data = await response.json();

            if (!response.ok) {
                // 如果後端回傳 400 或 404，顯示錯誤訊息
                throw new Error(data.message || data.error || '驗證失敗，請檢查資料是否正確');
            }

            // 驗證成功！隱藏表單，顯示資料面板
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';

            // 填入後端吐回來的真實資料
            document.getElementById('res-discord').innerText = data.discord_id;
            document.getElementById('res-tier').innerText = data.tier;
            document.getElementById('res-expiry').innerText = data.expiry_date;

        } catch (error) {
            errorMsg.innerText = error.message;
        } finally {
            // 恢復按鈕狀態
            btn.innerText = '登入驗證';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
